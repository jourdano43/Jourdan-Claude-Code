<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #007aff;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    padding: 24px;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 16px;
  }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  button {
    cursor: pointer;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    background: var(--accent);
    color: white;
    font-weight: 600;
  }

  button:hover { opacity: 0.9; }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .filters button {
    background: transparent;
    color: var(--muted);
    padding: 6px 12px;
    font-weight: 500;
  }

  .filters button.active {
    background: var(--border);
    color: var(--text);
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  li:last-child { border-bottom: none; }

  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }

  li span {
    flex: 1;
    word-break: break-word;
    font-size: 15px;
  }

  li.completed span {
    text-decoration: line-through;
    color: var(--muted);
  }

  li .delete-btn {
    background: transparent;
    color: var(--danger);
    padding: 4px 8px;
    font-weight: 700;
    font-size: 16px;
    line-height: 1;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
    font-size: 14px;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }

  .footer button {
    background: transparent;
    color: var(--muted);
    padding: 4px 8px;
    font-weight: 500;
    text-decoration: underline;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #38383a;
    }
  }
</style>
</head>
<body>

<div class="app">
  <h1>To-Do List</h1>

  <form id="todo-form">
    <input type="text" id="todo-input" placeholder="Add a new task…" autocomplete="off" maxlength="200">
    <button type="submit">Add</button>
  </form>

  <div class="filters">
    <button type="button" data-filter="all" class="active">All</button>
    <button type="button" data-filter="active">Active</button>
    <button type="button" data-filter="completed">Completed</button>
  </div>

  <ul id="todo-list"></ul>
  <div class="empty-state" id="empty-state" hidden>No tasks here.</div>

  <div class="footer">
    <span id="item-count">0 items</span>
    <button type="button" id="clear-completed">Clear completed</button>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "todos";

  const form = document.getElementById("todo-form");
  const input = document.getElementById("todo-input");
  const list = document.getElementById("todo-list");
  const emptyState = document.getElementById("empty-state");
  const itemCount = document.getElementById("item-count");
  const clearCompletedBtn = document.getElementById("clear-completed");
  const filterButtons = document.querySelectorAll(".filters button");

  let todos = loadTodos();
  let currentFilter = "all";

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function addTodo(text) {
    todos.push({ id: makeId(), text: text, completed: false });
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) {
      todo.completed = !todo.completed;
      saveTodos();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos();
    render();
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.completed);
    saveTodos();
    render();
  }

  function getFilteredTodos() {
    if (currentFilter === "active") return todos.filter(t => !t.completed);
    if (currentFilter === "completed") return todos.filter(t => t.completed);
    return todos;
  }

  function render() {
    const filtered = getFilteredTodos();
    list.innerHTML = "";

    filtered.forEach(todo => {
      const li = document.createElement("li");
      li.className = todo.completed ? "completed" : "";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.completed;
      checkbox.addEventListener("change", () => toggleTodo(todo.id));

      const span = document.createElement("span");
      span.textContent = todo.text;

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "×";
      deleteBtn.setAttribute("aria-label", "Delete task");
      deleteBtn.addEventListener("click", () => deleteTodo(todo.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);
      list.appendChild(li);
    });

    emptyState.hidden = filtered.length !== 0;

    const activeCount = todos.filter(t => !t.completed).length;
    itemCount.textContent = activeCount + " item" + (activeCount === 1 ? "" : "s") + " left";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addTodo(text);
    input.value = "";
    input.focus();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      filterButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });

  clearCompletedBtn.addEventListener("click", clearCompleted);

  render();
})();
</script>

</body>
</html>
